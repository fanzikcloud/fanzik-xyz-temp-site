        <style>
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            :root {
                --bg: #0c0d12;
                --surface: #13151f;
                --surface-hover: #171a26;
                --surface-inset: #0e1017;
                --border: rgba(255, 255, 255, 0.08);
                --border-hover: rgba(255, 255, 255, 0.16);
                --border-active: rgba(99, 102, 241, 0.35);
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                --font-mono: 'JetBrains Mono', monospace;
                --ease: cubic-bezier(0.23, 1, 0.32, 1);
            }

            body {
                background-color: var(--bg);
                color: var(--text-primary);
                font-family: var(--font-sans);
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px 16px;
                position: relative;
                overflow-x: hidden;
            }

            /* Subtle ambient vignette */
            .ambient {
                position: fixed;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 700px;
                height: 350px;
                background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
                pointer-events: none;
                z-index: 0;
            }

            /* Card */
            .card {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: 380px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            /* Top Bar */
            .card-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .brand-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-muted);
                letter-spacing: 0.02em;
            }

            .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #22c55e;
            }

            .client-tag {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-muted);
            }

            /* User Profile Row */
            .profile {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .avatar {
                width: 52px;
                height: 52px;
                border-radius: 12px;
                background: var(--surface-inset);
                border: 1px solid var(--border);
                padding: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .profile-text {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }

            .profile-name {
                font-size: 18px;
                font-weight: 600;
                color: var(--text-primary);
                line-height: 1.25;
                letter-spacing: -0.01em;
            }

            .profile-desc {
                font-size: 13px;
                color: var(--text-secondary);
                line-height: 1.4;
            }

            /* Telegram Direct Action Button */
            .btn-telegram {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                height: 48px;
                padding: 0 16px;
                background: var(--primary);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 10px;
                color: #ffffff;
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: background 140ms var(--ease), border-color 140ms var(--ease), transform 140ms var(--ease);
            }

            .btn-telegram:hover {
                background: var(--primary-hover);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-1px);
            }

            .btn-telegram:active {
                transform: scale(0.98);
            }

            .btn-left {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .tg-icon {
                width: 20px;
                height: 20px;
                fill: #ffffff;
                flex-shrink: 0;
            }

            .btn-arrow {
                width: 16px;
                height: 16px;
                stroke: #ffffff;
                stroke-width: 2;
                fill: none;
                opacity: 0.8;
                transition: transform 140ms var(--ease), opacity 140ms ease;
            }

            .btn-telegram:hover .btn-arrow {
                transform: translateX(2px);
                opacity: 1;
            }

            /* Secondary Copy Tag Row */
            .copy-box {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 14px;
                background: var(--surface-inset);
                border: 1px solid var(--border);
                border-radius: 10px;
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--text-secondary);
                cursor: pointer;
                transition: border-color 140ms var(--ease), background 140ms var(--ease);
                user-select: none;
            }

            .copy-box:hover {
                border-color: var(--border-hover);
                background: var(--surface-hover);
                color: var(--text-primary);
            }

            .copy-tag {
                color: var(--text-primary);
            }

            .copy-state {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 11px;
                color: var(--text-muted);
                transition: color 140ms ease;
            }

            .copy-box:hover .copy-state {
                color: var(--text-secondary);
            }

            .copy-box.copied {
                border-color: rgba(34, 197, 94, 0.35);
            }

            .copy-box.copied .copy-state {
                color: #4ade80;
            }

            .copy-icon {
                width: 14px;
                height: 14px;
                stroke: currentColor;
                stroke-width: 2;
                fill: none;
            }

            /* Footer */
            .card-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-top: 14px;
                border-top: 1px solid var(--border);
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-muted);
            }

            .card-footer a {
                color: var(--text-muted);
                text-decoration: none;
                transition: color 140ms ease;
            }

            .card-footer a:hover {
                color: var(--text-primary);
            }
        </style>
    </head>
    <body>
        <div class="ambient"></div>
        <div class="card">
            <!-- Top Status -->
            <div class="card-top">
                <div class="brand-pill">
                    <span class="status-dot"></span>
                    <span>онлайн</span>
                </div>
                <span class="client-tag">fanzik client</span>
            </div>
            <!-- Identity -->

        <script>
            function copyTag() {
                const tag = '@pvpfanzik';
                const box = document.getElementById('copyBox');
                const text = document.getElementById('copyText');
                const state = document.getElementById('copyState');

                const onSuccess = () => {
                    box.classList.add('copied');
                    text.textContent = 'скопировано';
                    setTimeout( () => {
                        box.classList.remove('copied');
                        text.textContent = 'скопировать';
                    }
                    , 2000);
                }
                ;

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(tag).then(onSuccess).catch( () => {
                        fallbackCopy(tag, onSuccess);
                    }
                    );
                } else {
                    fallbackCopy(tag, onSuccess);
                }
            }

            function fallbackCopy(str, cb) {
                const ta = document.createElement('textarea');
                ta.value = str;
                ta.style.position = 'fixed';
                ta.style.left = '-999999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    document.execCommand('copy');
                    if (cb)
                        cb();
                } catch (e) {}
                document.body.removeChild(ta);
            }
